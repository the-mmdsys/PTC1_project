$kind: http-example
request:
  url: "{{baseUrl}}/en/api/about/team-members/:id/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: id
      value: "5151"
      description: A unique integer value identifying this Team Member.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "full_name": "string",
        "id": 2292,
        "position": "string",
        "image": "https://hGw.gpfih+OZKXnsy"
      }
order: 1000
