$kind: http-request
url: "{{baseUrl}}/en/api/about/history/:id/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "5151"
    description: A unique integer value identifying this History.
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
examples: ./.resources/about history retrieve.resources/examples
order: 1000
