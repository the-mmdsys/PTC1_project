$kind: http-example
request:
  url: "{{baseUrl}}/en/api/about/history/:id/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: id
      value: "5151"
      description: A unique integer value identifying this History.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 6198,
        "title": "string",
        "year": "string"
      }
order: 1000
