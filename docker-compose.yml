version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    restart: on-failure
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ptc_db
      POSTGRES_USER: ptc_user
      POSTGRES_PASSWORD: 13861386
    ports: 
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql
    
volumes:
  postgres_data: